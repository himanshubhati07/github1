server.port=55513

# DataSource
spring.datasource.url=jdbc:postgresql://localhost:5432/gen_054b6290d0
spring.datasource.username=myuser
spring.datasource.password=mypassword
spring.datasource.driver-class-name=org.postgresql.Driver

# JPA / Hibernate
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.properties.hibernate.format_sql=true

# Seed data
spring.sql.init.mode=always
spring.sql.init.data-locations=classpath:data.sql
spring.jpa.defer-datasource-initialization=true

# Actuator
management.endpoints.web.exposure.include=health,info
management.endpoint.health.show-details=always

# Swagger / OpenAPI
springdoc.swagger-ui.path=/docs
springdoc.api-docs.path=/api-docs
springdoc.swagger-ui.enabled=true

# JWT
app.jwt.secret=${JWT_SECRET:EmployeeAttendanceManagementSystemSecretKey2024ForHS256Algorithm!@#$%}
app.jwt.expiration-ms=1800000

# Office settings (9:00 AM = late threshold)
app.office.start-hour=9
app.office.start-minute=0
